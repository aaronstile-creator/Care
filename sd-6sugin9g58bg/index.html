/* Pastel theme (ApexDigitalPros family, from Cadence Board Pastel): cloud #F4F2EE, mist blue #D5E3EA, powder rose #E7D5D4,
   lemon icing #F3E7B8, patina blue #8AA4B0 + lavender #CDBFEF. Swatches fill surfaces; deeper steps carry text.
   Four token blocks: Pastel (light), Pastel night (dark), and a high-contrast version of each. */
:root{
  color-scheme: light;
  --bg:#F4F2EE; --surface:#FFFFFF; --surface-2:#FAF9F6; --col-bg:#E6EEF2; --hover:rgba(38,51,58,.06);
  --border:#DCE4E8; --border-strong:#B8C8D0; --grid:#E8ECEE;
  --text:#26333A; --text-2:#4A5961; --text-3:#5A6971; --placeholder:#66757D;
  --lav:#6650A0; --pink:#9E4350; --mint:#3A6F51; --cyan:#3E6575; --blue:#3F6584; --amber:#735A0E;
  --lav-bg:#ECE6F8; --mint-bg:#E2EEE5; --pink-bg:#F5E8E7; --blue-bg:#E1ECF1; --lemon-bg:#F8F0D2;
  --input-bg:#FFFFFF; --input-line:#A9BBC4; --focus:#7B66B8;
  --accent:#CDBFEF; --accent-text:#5B4796; --accent-soft:#ECE6F8; --on-accent:#2E2452; --accent-line:#B3A2E0; --accent-hover:#C2B2EA; --link:#3E6575;
  --good:#6FA287; --good-text:#2F5E43; --good-soft:#E2EEE5;
  --warning:#E0BE4F; --warn-text:#735A0E; --warn-soft:#F8F0D2;
  --critical:#B4555F; --crit-text:#9A3F4A; --crit-soft:#F5E8E7; --on-critical:#FFFFFF;
  --shadow-sm:0 1px 2px rgba(38,51,58,.07); --shadow-lg:0 14px 36px rgba(38,51,58,.18);
  --backdrop:rgba(38,51,58,.4);
  /* medicine color tags: the family chart series (sage --s5 is reserved for "Taken") */
  --s1:#8766bb; --s2:#ac8a2e; --s3:#ba5566; --s4:#487cbd; --s5:#3d9c5e; --s6:#a75d90; --s7:#ce7443; --s8:#1a9ec1;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --radius:14px; --nav-h:78px;
}
@media (prefers-color-scheme: dark){

}
/* high contrast, light: black on white, every text pair >= 7:1 */
:root[data-contrast="high"]{
  color-scheme: light;
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F3F3F3; --col-bg:#F3F3F3; --hover:rgba(0,0,0,.08);
  --border:#000000; --border-strong:#000000; --grid:#D0D0D0;

  --accent:#2B1A6B; --accent-text:#2B1A6B; --accent-soft:#EDE8FA; --on-accent:#FFFFFF; --accent-line:#000000; --accent-hover:#3D2A8A; --link:#0A3A6B;
  --good:#0B4A27; --good-text:#0B4A27; --good-soft:#E3F2E8;

  --critical:#7A0F22; --crit-text:#7A0F22; --crit-soft:#FBE9EC; --on-critical:#FFFFFF;
  --shadow-sm:none; --shadow-lg:0 0 0 2px #000; --backdrop:rgba(0,0,0,.6);
}

  --bg:#000000; --surface:#000000; --surface-2:#141414; --col-bg:#141414; --hover:rgba(255,255,255,.14);
  --border:#FFFFFF; --border-strong:#FFFFFF; --grid:#555555;
  --text:#FFFFFF; --text-2:#F2F2F2; --text-3:#E0E0E0; --placeholder:#BDBDBD;
  --lav:#D9CCFF; --pink:#FFB3BE; --mint:#A8F0C4; --cyan:#A6E3FF; --blue:#B3D9FF; --amber:#FFE680;
  --lav-bg:#1E1640; --mint-bg:#0B2A18; --pink-bg:#3A0D16; --blue-bg:#0A2236; --lemon-bg:#332900;
  --input-bg:#000000; --input-line:#FFFFFF; --focus:#FFD400;
  --accent:#D9CCFF; --accent-text:#D9CCFF; --accent-soft:#1E1640; --on-accent:#000000; --accent-line:#FFFFFF; --accent-hover:#E8DFFF; --link:#A6E3FF;
  --good:#A8F0C4; --good-text:#A8F0C4; --good-soft:#0B2A18;
  --warning:#FFE680; --warn-text:#FFE680; --warn-soft:#332900;

  --shadow-sm:none; --shadow-lg:0 0 0 2px #FFF; --backdrop:rgba(0,0,0,.75);
  }
}
:root[data-contrast="high"][data-theme="dark"]{
  color-scheme: dark;
  --bg:#000000; --surface:#000000; --surface-2:#141414; --col-bg:#141414; --hover:rgba(255,255,255,.14);
  --border:#FFFFFF; --border-strong:#FFFFFF; --grid:#555555;
  --text:#FFFFFF; --text-2:#F2F2F2; --text-3:#E0E0E0; --placeholder:#BDBDBD;
  --lav:#D9CCFF; --pink:#FFB3BE; --mint:#A8F0C4; --cyan:#A6E3FF; --blue:#B3D9FF; --amber:#FFE680;
  --lav-bg:#1E1640; --mint-bg:#0B2A18; --pink-bg:#3A0D16; --blue-bg:#0A2236; --lemon-bg:#332900;
  --input-bg:#000000; --input-line:#FFFFFF; --focus:#FFD400;
  --accent:#D9CCFF; --accent-text:#D9CCFF; --accent-soft:#1E1640; --on-accent:#000000; --accent-line:#FFFFFF; --accent-hover:#E8DFFF; --link:#A6E3FF;
  --good:#A8F0C4; --good-text:#A8F0C4; --good-soft:#0B2A18;

/* ---------- base: everything is sized in rem, so the three text sizes (20 / 24 / 28 px) scale the whole app ---------- */
html{font-size:125%;-webkit-text-size-adjust:100%;scroll-padding-top:5rem}
html[data-text="larger"]{font-size:150%}
html[data-text="largest"]{font-size:175%}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:1rem/1.5 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overflow-wrap:break-word}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--link);text-underline-offset:.16em}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
p{margin:0}
ul,ol{margin:0}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.ic{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
.ic .fill{fill:currentColor;stroke:none}
.skip{position:absolute;left:.5rem;top:-6rem;z-index:100;padding:.6rem 1rem;background:var(--surface);color:var(--text);border:3px solid var(--focus);border-radius:10px;font-weight:700}
.skip:focus{top:.5rem}

/* ---------- buttons (family shapes, senior sizes: 48px minimum, 56px+ for primary actions) ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;min-height:2.6rem;padding:.35rem 1rem;border:2px solid var(--border-strong);border-radius:12px;background:var(--surface);color:var(--text);font-size:1rem;font-weight:650;line-height:1.2;text-align:center;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.5;cursor:default}
.btn-primary{background:var(--accent);border-color:var(--accent-line);color:var(--on-accent);font-weight:750}
.btn-primary:hover{background:var(--accent-hover)}
.btn-lg{min-height:2.9rem;padding:.5rem 1.25rem}
.btn-block{display:flex;width:100%}
.btn-danger{color:var(--crit-text);border-color:var(--critical)}
.btn-danger:hover{background:var(--crit-soft)}
.btn-danger.solid{background:var(--critical);border-color:var(--critical);color:var(--on-critical)}
.btn-row{display:flex;flex-wrap:wrap;gap:.6rem}
.icon-btn{display:inline-grid;place-items:center;width:2.5rem;height:2.5rem;min-width:48px;min-height:48px;padding:0;border:2px solid transparent;border-radius:12px;background:transparent;color:var(--text-2);flex:none}
.icon-btn:hover{background:var(--hover);color:var(--text)}
.icon-btn .ic{width:1.3rem;height:1.3rem}
.link-btn{display:inline-flex;align-items:center;gap:.3em;min-height:48px;padding:0 .4rem;border:0;background:none;color:var(--link);font-weight:700;text-decoration:underline;text-underline-offset:.18em}

/* ---------- header (family layout: mark, uppercase name, view tag, save state) ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--bg)}
.app-header{display:flex;align-items:center;flex-wrap:wrap;gap:.2rem .9rem;padding:.25rem max(1rem,env(safe-area-inset-right)) .25rem max(1rem,env(safe-area-inset-left));border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:.5rem;min-height:48px;color:var(--text);text-decoration:none;white-space:nowrap}
.logo{color:var(--lav);font-size:1.05rem;line-height:1}
.app-name{font-size:.95rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase}
.view-tag{font-size:.7rem;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--lav)}
.tabs{display:flex;flex-wrap:wrap;gap:.15rem;flex:1;min-width:0}   /* wraps to a second line rather than hiding a tab */
.tab{display:inline-flex;align-items:center;gap:.4em;min-height:48px;padding:0 .7rem;border-radius:10px;color:var(--cyan);font-size:.9rem;font-weight:650;text-decoration:none;white-space:nowrap}
.tab:hover{background:var(--hover);color:var(--text)}
.tab[aria-current="page"]{background:var(--lav-bg);color:var(--lav);font-weight:800;box-shadow:inset 0 -3px 0 var(--lav)}
.header-actions{display:flex;align-items:center;gap:.15rem;margin-left:auto}
.save-state{display:inline-flex;align-items:center;gap:.35em;margin-right:.3rem;font-size:.85rem;font-weight:600;color:var(--text-2);white-space:nowrap}
.save-state .ic{color:var(--good-text)}
.save-state.bad{color:var(--crit-text);font-weight:800}
.save-state.bad .ic{color:var(--crit-text)}
.save-state.example .ic{color:var(--lav)}
.ss-short{display:none}
.ribbon{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:.3rem .9rem;padding:.45rem 1rem;background:var(--lav-bg);border-bottom:2px solid var(--accent-line);font-size:.9rem;font-weight:650;text-align:center}
.ribbon .ic{margin-right:.3em;color:var(--lav)}
.ribbon .btn{min-height:2.4rem;padding:.2rem .8rem;font-size:.9rem}
.care-ribbon{background:var(--warn-soft);border-bottom-color:var(--warning)}
.care-ribbon .ic{color:var(--warn-text)}
.due-bar{position:sticky;top:3.3rem;z-index:20;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:.3rem 1rem;padding:.45rem 1rem;border-bottom:2px solid var(--lav);background:var(--lav-bg);color:var(--text);font-weight:750;text-align:center}
.due-bar .ic{margin-right:.35em;color:var(--lav)}
.due-bar .btn{min-height:2.4rem;padding:.2rem .9rem;border-color:var(--accent-line);background:var(--accent);color:var(--on-accent)}
.steps-list{margin:.4rem 0 .8rem;padding-left:1.4rem}
.steps-list li + li{margin-top:.3rem}
.install-panel{border-left:7px solid var(--lav)}
.bottom-nav{display:none}
@media (max-width:1499px){ .view-tag{display:none} }
@media (max-width:1399px){ .tab .ic{display:none} .ss-long{display:none} .ss-short{display:inline} }

/* ---------- page ---------- */
main{display:block;padding:1.3rem max(1rem,env(safe-area-inset-right)) 3rem max(1rem,env(safe-area-inset-left))}
main:focus{outline:none}
.page{max-width:46rem;margin:0 auto}
.page-wide{max-width:64rem}
.page-head{margin-bottom:1.2rem}
.head-row{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:.8rem 1rem}
.eyebrow{font-size:1rem;font-weight:650;color:var(--text-2)}
.page-title{font-size:1.6rem;font-weight:800;letter-spacing:-.01em}
.page-title:focus{outline:none}
.lede{margin-top:.35rem;color:var(--text-2)}
.hint{margin:-.1rem 0 .5rem;color:var(--text-2);font-size:.9rem}
.tag{display:inline-flex;align-items:center;gap:.3em;max-width:100%;padding:.05rem .55rem;border:1px solid;border-radius:99px;font-size:.85rem;font-weight:750}
.tag-late,.tag-low{color:var(--warn-text);background:var(--warn-soft);border-color:var(--warning)}
.tag-out{color:var(--crit-text);background:var(--crit-soft);border-color:var(--critical)}
.tag-stopped{color:var(--text-2);background:var(--surface-2);border-color:var(--border-strong)}

/* ---------- today ---------- */
.progress{margin-top:.8rem}
.progress-words{font-weight:700}
.bar{height:.6rem;margin-top:.45rem;border-radius:99px;background:var(--grid);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--good)}
.note-card{display:flex;align-items:center;gap:.7rem;margin-bottom:1rem;padding:.9rem 1.1rem;border:2px solid var(--nc,var(--border));border-radius:var(--radius);background:var(--nb,var(--surface));color:var(--nt,var(--text));font-weight:700}
.note-card .ic{width:1.5rem;height:1.5rem}
.note-card.good{--nc:var(--good);--nb:var(--good-soft);--nt:var(--good-text)}
.note-card.next{--nc:var(--border);--nt:var(--text)}
.note-card.next .ic{color:var(--cyan)}
.slot{margin:0 0 1rem;background:var(--surface);border:1px solid var(--border);border-left:7px solid var(--slot-c,var(--border-strong));border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.slot[data-state="due"]{--slot-c:var(--lav)}
.slot[data-state="notmarked"]{--slot-c:var(--warning)}
.slot[data-state="done"]{--slot-c:var(--good)}
.slot[data-state="prn"]{--slot-c:var(--cyan)}
.slot-h{margin:0;font-size:1rem;font-weight:400}
.slot-toggle,.slot-static{display:flex;align-items:center;gap:.8rem;width:100%;min-height:3.4rem;padding:.75rem 1rem;border:0;border-radius:var(--radius);background:transparent;color:inherit;text-align:left}
.slot-toggle:hover{background:var(--hover)}
.slot-icon{display:grid;place-items:center;width:2.5rem;height:2.5rem;border-radius:12px;background:var(--lav-bg);color:var(--lav);flex:none}
.slot-icon .ic{width:1.4rem;height:1.4rem}
.slot-title{flex:1;min-width:0}
.slot-name{display:block;font-size:1.2rem;font-weight:800}
.slot-sub{display:block;color:var(--text-2);font-size:.95rem;font-weight:650}
.slot-sub .ic{margin-right:.3em}
.slot[data-state="due"] .slot-sub{color:var(--lav)}
.slot[data-state="notmarked"] .slot-sub{color:var(--warn-text)}
.slot[data-state="done"] .slot-sub{color:var(--good-text)}
.chev{color:var(--text-3);transition:transform .2s}
.slot-toggle[aria-expanded="true"] .chev{transform:rotate(180deg)}
.slot-body{padding:0 1rem 1rem}
.dose-list{display:grid;grid-template-columns:minmax(0,1fr);gap:.7rem;margin:0;padding:0;list-style:none}
.dose{display:flex;align-items:center;flex-wrap:wrap;gap:.8rem 1rem;padding:.8rem;border:2px solid var(--border);border-radius:12px;background:var(--surface-2)}
.dose-info{flex:1 1 16rem;min-width:0}
.dose-top{display:flex;align-items:center;flex-wrap:wrap;gap:.5rem .7rem;margin-bottom:.3rem}
.dose-name{flex:1 1 9rem;min-width:0;font-size:1.15rem;font-weight:800;line-height:1.3;overflow-wrap:break-word}   /* at big text sizes a long name drops below the icon instead of splitting */
.dose-strength{font-weight:650;color:var(--text-2)}
.dose-how,.dose-extra{color:var(--text-2)}
.dose-how{font-weight:600}
.dose-flag{margin-top:.2rem;color:var(--warn-text);font-weight:750}
.dose-flag .ic,.taken-line .ic,.skip-line .ic{margin-right:.35em}
.dose-missed{margin-top:.4rem;padding:.45rem .7rem;border-left:4px solid var(--warning);border-radius:6px;background:var(--warn-soft)}
.med-mark{display:grid;place-items:center;width:3.2rem;height:3.2rem;border:2px solid color-mix(in srgb,var(--mc) 45%,var(--surface));border-radius:12px;background:color-mix(in srgb,var(--mc) 15%,var(--surface));color:var(--mc);flex:none;overflow:hidden}
.med-mark .ic{width:1.6rem;height:1.6rem}
.med-mark img{width:100%;height:100%;object-fit:cover}
.take-btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-width:9rem;min-height:3rem;padding:.5rem 1.3rem;border:2px solid var(--accent-line);border-radius:14px;background:var(--accent);color:var(--on-accent);font-size:1.1rem;font-weight:800;line-height:1.2}
.take-btn:hover{background:var(--accent-hover)}
.take-btn:active{transform:scale(.98)}
.take-btn.secondary{background:var(--surface);color:var(--accent-text)}
.take-btn.secondary:hover{background:var(--accent-soft)}
.dose.is-taken{border-color:var(--good);background:var(--good-soft)}
.dose.is-skipped{border-style:dashed;background:var(--surface)}
.dose-done{display:flex;align-items:center;flex-wrap:wrap;gap:.2rem 1rem}
.taken-line{color:var(--good-text);font-size:1.05rem;font-weight:800}
.taken-line .ic{width:1.4rem;height:1.4rem;vertical-align:-.3em}
.skip-line{color:var(--text-2);font-weight:750}
.taken-line:focus,.skip-line:focus{outline:none}
.take-all{margin-top:.9rem}
.pop{animation:pop .28s ease-out}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.info-card{display:flex;align-items:flex-start;gap:.8rem;margin-bottom:1rem;padding:.9rem 1.1rem;border:1px solid var(--border);border-left:7px solid var(--ic-c,var(--cyan));border-radius:var(--radius);background:var(--surface)}
.info-card.warn{--ic-c:var(--warning);background:var(--warn-soft)}
.info-card > .ic{width:1.5rem;height:1.5rem;margin-top:.1rem;color:var(--warn-text)}
.info-title{font-size:1.1rem;font-weight:800}
.plain{margin:.2rem 0 0;padding:0;list-style:none}
.empty{display:grid;justify-items:center;gap:.6rem;padding:1.6rem 1.2rem;border:2px dashed var(--border-strong);border-radius:var(--radius);background:var(--surface);text-align:center}
.empty > .ic{width:2rem;height:2rem;color:var(--lav)}
.empty-title{font-size:1.2rem;font-weight:800}

.dose-actions{display:flex;flex-direction:column;align-items:stretch;gap:.1rem}
.dose-actions .link-btn{justify-content:center;font-size:.9rem;font-weight:650}
.done-links{display:flex;flex-wrap:wrap;gap:0 .6rem}
.done-links .link-btn:last-child{font-weight:650}
.dose-note{margin-top:.4rem;padding:.35rem .7rem;border-left:4px solid var(--cyan);border-radius:0 8px 8px 0;background:var(--blue-bg);color:var(--text)}
.refill-list li{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:0 .8rem}

/* ---------- history ---------- */
.hist-controls{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:.8rem 1.2rem;margin-bottom:1rem}
.hist-filter{width:min(18rem,100%);margin:0}
.day-nav{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:.6rem}
.dn-label{min-width:0;font-size:1.1rem;font-weight:800;text-align:center}
.day-nav .btn{min-width:0}
.date-jump{display:flex;flex-wrap:wrap;align-items:flex-end;gap:.6rem 1rem;margin:.8rem 0 1.2rem}
.date-jump .field{width:min(14rem,100%);margin:0}
.answer > h2.ans-head{display:flex;align-items:flex-start;gap:.5rem;padding-left:0;border-left:0;font-size:1.25rem;color:var(--text)}
.ans-head .ic{width:1.5rem;height:1.5rem;margin-top:.05rem}
.ans-head:focus{outline:none}
.ans-head[data-state="done"]{color:var(--good-text)}
.ans-head[data-state="notmarked"]{color:var(--warn-text)}
.ans-head[data-state="due"]{color:var(--lav)}
.ans-list{display:grid;gap:.5rem;margin:0;padding:0;list-style:none}
.ans{display:flex;align-items:flex-start;gap:.6rem;padding:.6rem .8rem;border-left:5px solid var(--a-c,var(--border-strong));border-radius:0 10px 10px 0;background:var(--surface-2)}
.ans > .ic{width:1.3rem;height:1.3rem;margin-top:.15rem;color:var(--a-c,var(--text-2))}
.ans[data-state="done"]{--a-c:var(--good-text)}
.ans[data-state="notmarked"]{--a-c:var(--warn-text)}
.ans[data-state="due"]{--a-c:var(--lav)}
.ans[data-state="prn"]{--a-c:var(--cyan)}
.ans-names{display:block;color:var(--warn-text);font-weight:700}
.timeline{display:grid;margin:0;padding:0;list-style:none}
.tl{display:grid;grid-template-columns:1.6rem minmax(0,1fr);gap:.7rem;padding:.7rem 0;border-top:1px solid var(--border)}
.tl:first-child{border-top:0;padding-top:0}
.tl > .ic{width:1.5rem;height:1.5rem;margin-top:.05rem;color:var(--text-3)}
.tl[data-kind="taken"] > .ic,.tl[data-kind="taken"] .tl-status{color:var(--good-text)}
.tl[data-kind="notmarked"] > .ic,.tl[data-kind="notmarked"] .tl-status{color:var(--warn-text)}
.tl[data-kind="due"] > .ic,.tl[data-kind="due"] .tl-status{color:var(--lav)}
.tl-time,.tl-status{font-weight:800}
.tl-med{font-weight:650}
.tl-meta{display:flex;flex-wrap:wrap;align-items:center;gap:.2rem .5rem;color:var(--text-2);font-size:.9rem}
.tl-strike,.tl-strike .tl-status{color:var(--text-2)!important;text-decoration:line-through;text-decoration-thickness:2px}
.tl-void{margin-top:.2rem;color:var(--text-2);font-size:.9rem;font-weight:650}
.wk-sum{margin-bottom:1rem;font-size:1.05rem}
.hist-foot{margin-top:1.4rem;padding-top:1rem;border-top:1px solid var(--border)}
.week-list{display:grid;grid-template-columns:minmax(0,1fr);gap:.6rem;margin:0;padding:0;list-style:none}
.wk-day{display:flex;align-items:center;gap:.8rem;width:100%;padding:.8rem 1rem;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow-sm);color:var(--text);text-align:left}
.wk-day:hover{border-color:var(--border-strong)}
.wk-main{display:block;flex:1;min-width:0}
.wk-date{display:block;margin-bottom:.35rem;font-weight:800}
.wk-chips{display:flex;flex-wrap:wrap;gap:.4rem}
.wk-chip{display:inline-flex;align-items:center;gap:.3em;padding:.1rem .6rem;border:1px solid var(--c-b,var(--border-strong));border-radius:99px;background:var(--c-bg,var(--surface-2));color:var(--c-t,var(--text));font-size:.9rem;font-weight:700}
.wk-chip[data-state="done"]{--c-b:var(--good);--c-bg:var(--good-soft);--c-t:var(--good-text)}
.wk-chip[data-state="notmarked"]{--c-b:var(--warning);--c-bg:var(--warn-soft);--c-t:var(--warn-text)}
.wk-chip[data-state="due"]{--c-b:var(--lav);--c-bg:var(--lav-bg);--c-t:var(--lav)}
.wk-chip[data-state="skipped"]{border-style:dashed}
.wk-chip[data-state="prn"]{--c-b:var(--cyan);--c-bg:var(--blue-bg);--c-t:var(--cyan)}
[data-contrast="high"] .wk-day{border-width:2px;border-color:var(--border)}
[data-contrast="high"] .wk-chip{border-width:2px}

/* ---------- appointments, people, notes ---------- */
.card-group{margin-bottom:1.3rem}
.group-h{margin-bottom:.6rem;font-size:1.1rem;font-weight:800;color:var(--text-2)}
.card-list{display:grid;grid-template-columns:minmax(0,1fr);gap:.7rem;margin:0;padding:0;list-style:none}
.appt-card{display:flex;align-items:flex-start;gap:1rem;padding:1rem;border:1px solid var(--border);border-left:7px solid var(--cyan);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow-sm)}
.appt-card.past{border-left-color:var(--border-strong)}
.appt-date{display:flex;flex-direction:column;align-items:center;justify-content:center;width:4.2rem;min-height:4.6rem;padding:.3rem;border-radius:12px;background:var(--blue-bg);color:var(--cyan);font-size:.85rem;font-weight:750;line-height:1.15;flex:none;text-transform:uppercase}
.appt-date b{font-size:1.6rem;line-height:1.1}
.appt-card.past .appt-date{background:var(--surface-2);color:var(--text-2)}
.appt-main{flex:1;min-width:0}
.appt-main > p{margin-top:.15rem}
.appt-title{font-size:1.2rem;font-weight:800}
.appt-when{font-weight:750;color:var(--cyan)}
.appt-q{margin-top:.5rem;padding:.5rem .8rem;border-left:4px solid var(--lav);border-radius:0 8px 8px 0;background:var(--lav-bg)}
.appt-q ul{margin:.2rem 0 0;padding-left:1.2rem}
.appt-actions{margin-top:.8rem}
.person-card{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.6rem 1rem;padding:1rem;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow-sm)}
.pc-main{flex:1 1 13rem;min-width:0}
.pc-name{font-size:1.2rem;font-weight:800}
.pc-role{color:var(--text-2);font-weight:600}
.pc-role b{color:var(--crit-text)}
.pc-phone{font-weight:650}
.pc-actions{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem}
.call-btn{border-color:var(--good-text);background:var(--good-text);color:var(--surface)}
.call-btn:hover{background:var(--good-text);filter:brightness(1.1)}
.emergency-card{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.8rem 1rem;margin-bottom:1.3rem;padding:1rem 1.1rem;border:2px solid var(--critical);border-radius:var(--radius);background:var(--crit-soft)}
.ec-title{color:var(--crit-text);font-size:1.15rem;font-weight:800}
.ec-title .ic{margin-right:.3em}
.panel-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.6rem;margin-bottom:.5rem}
.panel-top > h2{padding-left:.6rem;border-left:4px solid var(--cyan);font-size:1.15rem}
.kv-list{display:grid;gap:.5rem;margin:0}
.kv{display:grid;grid-template-columns:minmax(8rem,12rem) minmax(0,1fr);gap:.2rem 1rem}
.kv dt{color:var(--text-2);font-weight:650}
.kv dd{margin:0}
.muted-txt{color:var(--text-2);font-style:italic}
.note-form-row{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:.8rem 1rem}
.note-form-row .field{flex:1 1 12rem;margin:0}
.note-item{padding:.8rem 1rem;border:1px solid var(--border);border-left:5px solid var(--cyan);border-radius:var(--radius);background:var(--surface)}
.note-meta{color:var(--text-2)}
.note-text{margin:.2rem 0 .1rem;white-space:pre-wrap}
.link-card{color:var(--text);text-decoration:none;align-items:center}
.link-card:hover{border-color:var(--border-strong)}
.link-card > div,.info-card > div{flex:1;min-width:0}
.link-card > .ic:first-child,.help-card > .ic{color:var(--cyan)}
.share-row{margin:1.4rem 0 .4rem;text-align:center}
.btn-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(15rem,100%),1fr));gap:.6rem}
.warn-line{padding:.4rem .7rem;border-left:4px solid var(--warning);border-radius:0 8px 8px 0;background:var(--warn-soft)}
[data-contrast="high"] .appt-card,[data-contrast="high"] .person-card,[data-contrast="high"] .note-item{border-width:2px;border-color:var(--border)}
[data-contrast="high"] .appt-card{border-left-width:9px;border-left-color:var(--cyan)}
@media (max-width:599px){
  .appt-card{flex-direction:column;gap:.6rem}
  .appt-date{flex-direction:row;gap:.4rem;width:auto;min-height:0;padding:.3rem .7rem;align-self:flex-start}
  .appt-date b{font-size:1.1rem}
  .appt-actions .btn,.pc-actions .btn{flex:1 1 100%}
  .kv{grid-template-columns:minmax(0,1fr)}
}

/* ---------- medicines ---------- */
.med-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:.8rem}
@media (min-width:900px){ .page-wide .med-grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
.med-card{display:flex;align-items:center;gap:.9rem;width:100%;min-width:0;padding:.9rem 1rem;border:1px solid var(--border);border-left:7px solid var(--mc);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow-sm);color:var(--text);text-align:left}
.med-card:hover{border-color:var(--border-strong);border-left-color:var(--mc)}
.mc-text{display:block;flex:1;min-width:0}
.mc-name{display:block;font-size:1.15rem;font-weight:800;overflow-wrap:anywhere;hyphens:auto}
.mc-line{display:block;color:var(--text-2)}
.mc-tags{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.35rem}
details.stopped{margin-top:1.4rem}
details.stopped > summary{min-height:48px;padding:.5rem 0;font-weight:750;color:var(--link);cursor:pointer}
details.stopped .med-card{opacity:.85}

/* ---------- forms ---------- */
.field{display:block;min-width:0;margin:0 0 1.15rem;padding:0;border:0}
.field > label,.field > legend,.label{display:block;margin-bottom:.35rem;padding:0;font-weight:750}
.req{font-weight:500;color:var(--text-2);font-size:.9rem}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=tel],select,textarea{width:100%;min-height:2.8rem;padding:.4rem .7rem;border:2px solid var(--input-line);border-radius:10px;background:var(--input-bg);color:var(--text)}
input::placeholder,textarea::placeholder{color:var(--placeholder)}
input:focus,select:focus,textarea:focus{border-color:var(--focus)}
textarea{min-height:5rem;resize:vertical}
.field-err{display:flex;align-items:center;gap:.35em;margin-top:.4rem;color:var(--crit-text);font-weight:750}
.invalid{border-color:var(--critical)!important}
.amount-row{display:flex;gap:.6rem}
.amount-row input{max-width:7rem}
.amount-row select{max-width:14rem}
.two-col{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(12rem,100%),1fr));gap:0 1rem}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{position:relative;display:inline-flex;align-items:center;gap:.45em;min-height:2.8rem;padding:.35rem 1rem;border:2px solid var(--border-strong);border-radius:999px;background:var(--surface);font-weight:650;cursor:pointer;user-select:none}
.chip input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.chip .tick{display:none}
.chip small{font-size:.85rem;font-weight:500;color:var(--text-2)}
.chip:hover{border-color:var(--lav)}
.chip:has(input:checked){border-color:var(--lav);background:var(--lav-bg);color:var(--lav)}
.chip:has(input:checked) small{color:var(--lav)}
.chip:has(input:checked) .tick{display:inline}
.chip:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.dot{width:1.1rem;height:1.1rem;border:2px solid color-mix(in srgb,var(--sw) 60%,#000);border-radius:50%;background:var(--sw);flex:none}
details.more{margin:.4rem 0 1rem;border:1px solid var(--border-strong);border-radius:12px;background:var(--surface-2)}
details.more > summary{display:flex;align-items:center;gap:.5em;min-height:3rem;padding:.6rem 1rem;color:var(--link);font-weight:750;cursor:pointer}
details.more > summary .req{color:var(--text-2)}
.more-body{padding:.6rem 1rem .4rem;border-top:1px solid var(--border)}
.sub-box{margin:-.4rem 0 1.15rem;padding:.8rem 1rem .1rem;border-left:4px solid var(--lav);border-radius:0 10px 10px 0;background:var(--lav-bg)}
.photo-box{display:flex;align-items:center;flex-wrap:wrap;gap:1rem}
.photo-prev{display:grid;place-items:center;width:5rem;height:5rem;border:2px solid var(--border-strong);border-radius:14px;background:var(--surface);color:var(--text-3);overflow:hidden;flex:none}
.photo-prev img{width:100%;height:100%;object-fit:cover}
.photo-prev .ic{width:2rem;height:2rem}
.danger-zone{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.2rem;padding-top:1rem;border-top:1px solid var(--border)}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:1rem;min-height:3rem;padding:.45rem 0;cursor:pointer}
.switch-row + .switch-row{border-top:1px solid var(--border)}
.switch-text b{display:block}
.switch-text span{display:block;color:var(--text-2);font-size:.9rem}
.switch{position:relative;width:3.4rem;height:1.9rem;min-width:56px;margin:0;border:2px solid var(--text-3);border-radius:99px;background:var(--text-3);cursor:pointer;flex:none;-webkit-appearance:none;appearance:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:calc(1.9rem - 8px);height:calc(1.9rem - 8px);border-radius:50%;background:var(--surface);transition:transform .15s}
.switch:checked{border-color:var(--good-text);background:var(--good-text)}
.switch:checked::after{transform:translateX(1.5rem)}

/* ---------- panels, settings, more ---------- */
.panel{margin-bottom:1rem;padding:1.1rem 1.2rem;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow-sm)}
.panel > h2{margin-bottom:.7rem;padding-left:.6rem;border-left:4px solid var(--cyan);font-size:1.15rem}
.panel > p{margin-bottom:.8rem}
.preview-text{margin-top:.8rem;padding:.7rem 1rem;border:2px dashed var(--border-strong);border-radius:10px;background:var(--surface-2)}
.routine-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(9.5rem,100%),1fr));gap:0 1rem}
.menu-list{display:grid;grid-template-columns:minmax(0,1fr);gap:.6rem;margin:0;padding:0;list-style:none}
.menu-row{display:flex;align-items:center;gap:.9rem;width:100%;min-height:4rem;padding:.6rem 1rem;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);font-size:1.1rem;font-weight:750;text-align:left;text-decoration:none;box-shadow:var(--shadow-sm)}
.menu-row:hover{border-color:var(--border-strong)}
.menu-row > .ic:first-child{width:1.5rem;height:1.5rem;color:var(--lav)}
.menu-row > span{flex:1;min-width:0;overflow-wrap:anywhere}
.menu-row small{display:block;font-size:.9rem;font-weight:500;color:var(--text-2)}
.disclaimer{margin-top:1rem;padding:.7rem 1rem;border-left:4px solid var(--cyan);border-radius:0 10px 10px 0;background:var(--blue-bg)}

/* ---------- setup ---------- */
.setup{max-width:38rem;margin:0 auto}
.steps{display:flex;gap:.4rem;margin-bottom:.6rem}
.steps i{flex:1;height:.4rem;border-radius:99px;background:var(--grid)}
.steps i.on{background:var(--lav)}
.step-count{margin-bottom:.4rem;font-weight:700;color:var(--text-2)}
.setup-card{margin-top:1rem;padding:1.3rem;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow-sm)}
.setup-nav{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.6rem;margin-top:1.3rem}
.setup-alt{margin-top:1rem;text-align:center}
.reassure{display:grid;gap:.55rem;margin:1rem 0 0;padding:0;list-style:none}
.reassure li{display:flex;align-items:flex-start;gap:.6rem}
.reassure .ic{margin-top:.2rem;color:var(--good-text)}
.muted-box{margin-bottom:1rem;padding:1rem;border:2px dashed var(--border-strong);border-radius:12px;color:var(--text-2);text-align:center}

/* ---------- dialogs (native <dialog>: focus trap, Esc and top layer for free) ---------- */
dialog{color:var(--text)}
dialog::backdrop{background:var(--backdrop)}
.sheet{width:min(42rem,calc(100vw - 2rem));max-height:calc(100dvh - 2rem);padding:0;border:1px solid var(--border);border-radius:18px;background:var(--surface);box-shadow:var(--shadow-lg);overflow:hidden}
.sheet-in{display:flex;flex-direction:column;max-height:calc(100dvh - 2rem);margin:0}
.sheet-head{display:flex;align-items:center;gap:.6rem;padding:.6rem .7rem .6rem 1.2rem;border-bottom:1px solid var(--border)}
.sheet-head h2{flex:1;font-size:1.3rem}
.sheet-head h2:focus{outline:none}
.sheet-body{flex:1;overflow:auto;padding:1.1rem 1.2rem}
.sheet-foot{display:flex;justify-content:flex-end;gap:.6rem;padding:.8rem 1.2rem calc(.8rem + env(safe-area-inset-bottom));border-top:1px solid var(--border);background:var(--surface-2)}
.help h3{margin:1.1rem 0 .3rem;font-size:1.1rem}
.help h3:first-child{margin-top:0}
.help ol{padding-left:1.4rem}
.help li + li{margin-top:.3rem}
.confirm{width:min(30rem,calc(100vw - 2rem));padding:0;border:1px solid var(--border);border-radius:18px;background:var(--surface);box-shadow:var(--shadow-lg)}
.confirm form{margin:0;padding:1.3rem}
.confirm h2{margin-bottom:.5rem;font-size:1.25rem}
.confirm p{margin-bottom:1.2rem;color:var(--text-2);white-space:pre-line}
.confirm-btns{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:.6rem}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:1.2rem;z-index:60;display:flex;align-items:center;gap:.8rem;width:max-content;max-width:min(36rem,calc(100vw - 1.5rem));padding:.55rem .55rem .55rem 1rem;border:1px solid var(--border-strong);border-left:6px solid var(--lav);border-radius:12px;background:var(--surface);color:var(--text);font-weight:650;box-shadow:var(--shadow-lg);opacity:0;visibility:hidden;transform:translate(-50%,10px);transition:opacity .16s,transform .16s,visibility 0s .16s}
.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0);transition:opacity .16s,transform .16s}
.toast.error{border-left-color:var(--critical)}
.toast button{flex:none;min-height:48px;padding:0 1rem;border:2px solid var(--lav);border-radius:10px;background:transparent;color:var(--lav);font-weight:800}
.toast button:hover{background:var(--lav-bg)}

/* ---------- high contrast extras ---------- */
[data-contrast="high"] .slot,[data-contrast="high"] .panel,[data-contrast="high"] .med-card,[data-contrast="high"] .info-card,[data-contrast="high"] .setup-card,[data-contrast="high"] .menu-row,[data-contrast="high"] .empty{border-width:2px;border-color:var(--border)}
[data-contrast="high"] .slot,[data-contrast="high"] .info-card{border-left-width:9px;border-left-color:var(--slot-c,var(--ic-c,var(--border)))}
[data-contrast="high"] .med-card{border-left-width:9px;border-left-color:var(--mc)}
[data-contrast="high"] .dose{border-color:var(--border)}

// One day's doses with their marks and status, grouped by time of day. Today and History both read from this.
function dayModel(p, day, t, medId = ''){
  const idx = logIndex(p);
  const items = dosesForDay(p, day).filter(o => !medId || o.med.id === medId)
    .map(o => { const entry = idx.get(o.key) || null; return {...o, entry, status: doseStatus(o, entry, t)}; });
  const groups = SLOTS.map(s => {
    const its = items.filter(i => i.slot === s.id);
    if (!its.length) return null;
    const pending = its.filter(i => !i.entry);
    const state = !pending.length ? 'done' : pending.some(i => i.status === 'notmarked') ? 'notmarked' : pending.some(i => i.status === 'due') ? 'due' : 'later';
    return {slot: s, items: its, pending, state};

function syncDoseForm(f){

function saveDoseForm(f){
  const p = P(), occ = findOcc(doseEdit?.key || '');
  if (!occ){ closeSheet(); return; }
  const fe = f.elements, note = fe.note.value.trim(), t = now();
  const e = doseEdit.entryId ? p.log.find(x => x.id === doseEdit.entryId && !x.voidedAt) : null;
  const what = e ? e.kind : fe.what.value;
  let at = null;
  if (what === 'taken' && fe.at){
    at = isHM(fe.at.value) ? occTs(occ.day, fe.at.value) : null;

  }

    if (e.voidedAt) e.voidReason = `Time changed to ${fmtTime(at)}`;

function saveMedForm(f){

  const today = careDay(now());

  const until = markedToday ? today : addDays(today, -1);

  m.instructions = fe.instructions.value.trim(); m.ifMissed = fe.ifMissed.value.trim();
  m.prescriber = fe.prescriber.value.trim(); m.rxNumber = fe.rxNumber.value.trim(); m.pharmacy = fe.pharmacy.value.trim(); m.notes = fe.notes.value.trim();

}

function shrinkImage(file, max){
  return new Promise((res, rej) => {
    if (!/^image\//.test(file.type) || file.size > 30e6) return rej(new Error('not an image'));
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.max(1, Math.round(img.naturalWidth * s)), h = Math.max(1, Math.round(img.naturalHeight * s));
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', .75));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('could not read')); };
    img.src = url;
  });
}

  p.log.forEach(e => { if (!seen.has(e.medId)) seen.set(e.medId, snapLabel(e) + ' (deleted)'); });

}

const dayName = (d, today) => fmtDayLong(d) + (d === today ? ' · Today' : d === addDays(today, -1) ? ' · Yesterday' : '');
function histDayHTML(p, t){
  const h = ui.hist, today = careDay(t), day = h.day;
  const m = dayModel(p, day, t, h.med);
  const entries = p.log.filter(e => e.date === day && (!h.med || e.medId === h.med));
  const prn = entries.filter(e => isPrnEntry(e) && !e.voidedAt && e.kind === 'taken').sort((a, b) => ms(a.at) - ms(b.at));
  const counts = m.groups.map(g => ({g, c: slotCounts(g)}));
  const sum = k => counts.reduce((a, x) => a + x.c[k].length, 0);
  const [nm, due, lt, sk] = ['notmarked', 'due', 'later', 'skipped'].map(sum);
  const head = !m.items.length && !prn.length ? {st: 'later', txt: day === today ? 'Nothing is scheduled today.' : 'Nothing was scheduled on this day.'}

  const rows = counts.map(({g, c}) => {

      : [c.taken.length && `${c.taken.length} taken`, c.skipped.length && `${c.skipped.length} skipped`, c.notmarked.length && `${c.notmarked.length} not marked`,

function histWeekHTML(p, t){

/* ================= sending a day's update to family ================= */
function dayUpdateText(p, day, t){
  const m = dayModel(p, day, t), lines = [`${p.callName || p.name || 'SureDose'} · ${fmtDayLong(day)}`];
  m.groups.forEach(g => {
    const c = slotCounts(g);
    lines.push(`${g.slot.name}: ` + (c.taken.length === c.n ? (c.n === 1 ? `taken ${timeSpan(c.taken)}` : `all ${c.n} taken, ${timeSpan(c.taken)}`)
      : [c.taken.length && `${c.taken.length} taken`, c.skipped.length && `${c.skipped.length} skipped`, c.notmarked.length && `${c.notmarked.length} not marked (${joinList(c.notmarked.map(i => medLabel(i.med)))})`,
         c.due.length && `${c.due.length} due now`, c.later.length && `${c.later.length} later today`].filter(Boolean).join(', ')));
  });
  const prn = p.log.filter(e => e.date === day && isPrnEntry(e) && !e.voidedAt && e.kind === 'taken').sort((a, b) => ms(a.at) - ms(b.at));
  if (prn.length) lines.push('As needed: ' + prn.map(e => `${snapLabel(e)} at ${fmtTime(ms(e.at))}`).join('; '));
  if (!m.items.length && !prn.length) lines.push('No medicines were scheduled.');
  const next = day === careDay(t) ? upcomingAppts(p, t)[0] : null;
  if (next) lines.push(`Next appointment: ${apptWhen(next)}, ${apptLabel(next)}`);
  lines.push('', 'Sent from SureDose');
  return lines.join('\n');
}

  download(`suredose-backup-${slug(P()?.callName)}-${ymd(now())}.json`, JSON.stringify({...store, exportedAt: store.lastBackupAt, photos: withPhotos ? photos : {}}), 'application/json');
  toast('Backup saved. Keep the file somewhere safe, such as an email to yourself.', {ms: 8000});
  if (['settings', 'meds'].includes(ui.route)) rerenderKeepFocus();
}
async function restoreBackup(file){
  if (!file) return;
  if (sample){ toast('Leave the example first, then restore.'); return; }
  if (file.size > 25e6){ toast('That file is too big to be a SureDose backup.', {error: true}); return; }
  let data, next;
  try { data = JSON.parse(await file.text()); } catch (e) { toast('That file couldn’t be read. Choose the backup file, which ends in .json.', {error: true}); return; }
  try { next = normalizeStore(migrate(data), true); } catch (e) { toast(e.message, {error: true}); return; }
  const p = next.people[0];
  if (!p){ toast('That backup is empty.', {error: true}); return; }
  const when = ms(data.exportedAt || next.savedAt);
  const parts = [[p.meds.length, 'medicine'], [p.log.length, 'history entry', 'history entries'], [p.appts.length, 'appointment'], [p.contacts.length, 'person', 'people'], [p.notes.length, 'note']]
    .filter(x => x[0]).map(x => plural(...x));
  if (!parts.length) parts.push('no medicines yet');
  const ok = await confirmBox({title: `Restore the backup for ${p.callName || p.name || 'this person'}?`,
    message: `It has ${joinList(parts)}${when ? `, saved ${fmtDayLong(ymd(when))} at ${fmtTime(when)}` : ''}.\nIt replaces what’s on this device now. Text size and colors stay as they are.`, ok: 'Restore it', cancel: 'Cancel'});
  if (!ok) return;
  const before = {store: JSON.stringify(store), photos: JSON.stringify(photos)};
  const {theme, contrast, text, sound, vibrate} = ST();
  const medIds = new Set(next.people.flatMap(x => x.meds.map(m => m.id)));
  next.settings = normalizeSettings({...next.settings, theme, contrast, text, sound, vibrate});
  next.ui.welcomed = true;
  store = next;
  photos = Object.fromEntries(Object.entries(data.photos && typeof data.photos === 'object' ? data.photos : {}).filter(([k, v]) => medIds.has(k) && typeof v === 'string' && v.startsWith('data:image/')));
  savePhotos(); saveNow();
  undoStack.length = 0; ui.open = {}; ui.hist = {day: '', mode: 'day', med: ''};
  go('today');
  toast('The backup was restored.', {action: 'Undo', ms: 12000, onAction: () => {
    store = normalizeStore(JSON.parse(before.store), false); photos = JSON.parse(before.photos);
    savePhotos(); saveNow(); applyDisplay(); render(); toast('Back to how it was.');
  }});
}

const pdHead = (title, sub) => `<header class="pd-head"><p class="pd-brand">◆ SureDose</p><h1>${title}</h1>${sub ? `<p class="pd-sub">${sub}</p>` : ''}</header>`;

function pdMedTable(p, compact){

const lastDays = (n, t) => [...Array(n)].map((_, k) => addDays(careDay(t), k - n + 1));
function pdHistory(p, days){
  const t = now(), all30 = lastDays(days, t);

  const firstUsed = all30.findIndex(d => dayModel(p, d, t).items.length || p.log.some(e => e.date === d));
  const list = firstUsed > 0 ? all30.slice(firstUsed) : all30, models = list.map(d => dayModel(p, d, t));
  const used = SLOTS.filter(s => models.some(m => m.groups.some(g => g.slot.id === s.id)));
  const tot = {taken: 0, skipped: 0, notmarked: 0}, notable = [];
  const rows = list.map((d, k) => {
    const m = models[k];
    const cells = used.map(s => {
      const g = m.groups.find(x => x.slot.id === s.id);
      if (!g) return '<td></td>';
      const c = slotCounts(g);
      ['taken', 'skipped', 'notmarked'].forEach(x => { tot[x] += c[x].length; });
      c.notmarked.forEach(i => notable.push([i.ts, `${fmtDayShort(d)}, ${s.name.toLowerCase()}: ${medLabel(i.med)} was not marked.`]));
      c.skipped.forEach(i => notable.push([i.ts, `${fmtDayShort(d)}, ${s.name.toLowerCase()}: ${medLabel(i.med)} was skipped${i.entry.skipReason ? ` (${i.entry.skipReason})` : ''}.`]));
      const txt = c.later.length + c.due.length === c.n ? 'later today' : c.taken.length === c.n ? `✓ ${c.n} of ${c.n}`
        : [`${c.taken.length} of ${c.n} taken`, c.skipped.length && `${c.skipped.length} skipped`, c.notmarked.length && `${c.notmarked.length} not marked`,
           c.due.length && `${c.due.length} due now`, c.later.length && `${c.later.length} later today`].filter(Boolean).join(', ');
      return `<td${c.notmarked.length ? ' class="pd-flag"' : ''}>${txt}</td>`;
    }).join('');
    const prn = p.log.filter(e => e.date === d && isPrnEntry(e) && !e.voidedAt && e.kind === 'taken').length;
    return `<tr><th scope="row">${esc(fmtDayShort(d))}</th>${cells}<td>${prn ? `${prn}×` : ''}</td></tr>`;
  }).join('');
  p.log.filter(e => list.includes(e.date)).forEach(e => {
    const when = `${fmtDayShort(e.date)} ${fmtTime(ms(e.at))}`;
    if (e.voidedAt) notable.push([ms(e.at), `${when}: ${snapLabel(e)} was marked ${e.kind}, then changed (${lcFirst(e.voidReason || 'marked as not taken')}).`]);
    else {
      if (e.late) notable.push([ms(e.at), `${when}: ${snapLabel(e)} was taken late.`]);

    <p class="pd-sum"><b>${tot.taken} of ${plural(all, 'scheduled dose')}</b> marked taken${tot.skipped ? `, ${tot.skipped} skipped` : ''}${tot.notmarked ? `, ${tot.notmarked} not marked` : ''}.</p>
    <table class="pd-table pd-grid"><thead><tr><th>Day</th>${used.map(s => `<th>${s.name}</th>`).join('')}<th>As needed</th></tr></thead><tbody>${rows}</tbody></table>
    ${notable.length ? `<h2>Worth a look</h2><ul class="pd-list">${notable.map(n => `<li>${esc(n[1])}</li>`).join('')}</ul>` : ''}`;
}
function pdAdherence(p, days){
  const t = now(), list = lastDays(days, t), rows = new Map();
  const row = (id, name) => rows.get(id) || (rows.set(id, {name, taken: 0, skipped: 0, notmarked: 0, prn: 0}), rows.get(id));
  list.forEach(d => dayModel(p, d, t).items.forEach(i => { const r = row(i.med.id, medLabel(i.med)), k = i.entry ? i.entry.kind : i.status; if (k in r) r[k]++; }));
  p.log.filter(e => list.includes(e.date) && isPrnEntry(e) && !e.voidedAt && e.kind === 'taken').forEach(e => { row(e.medId, snapLabel(e)).prn++; });
  if (!rows.size) return '<p>Nothing was recorded in these days.</p>';
  return `<table class="pd-table"><thead><tr><th>Medicine</th><th>Taken</th><th>Skipped</th><th>Not marked</th></tr></thead><tbody>${[...rows.values()].sort((a, b) => a.name.localeCompare(b.name)).map(r =>
    `<tr><td><b>${esc(r.name)}</b>${r.prn ? '<br><span class="pd-dim">as needed</span>' : ''}</td><td>${r.prn ? `${r.prn} time${r.prn === 1 ? '' : 's'}` : r.taken}</td><td>${r.prn ? '' : r.skipped}</td><td${r.notmarked ? ' class="pd-flag"' : ''}>${r.prn ? '' : r.notmarked}</td></tr>`).join('')}</tbody></table>`;
}

/* ================= calendar files (.ics): appointments, and repeating medicine reminders ================= */
const icsEsc = s => String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
const icsFold = line => { const out = []; let s = line; while (s.length > 60){ out.push(s.slice(0, 60)); s = ' ' + s.slice(60); } out.push(s); return out.join('\r\n'); };
const icsUtc = t => new Date(t).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
const icsLocal = (day, hm) => day.replace(/-/g, '') + 'T' + hm.replace(':', '') + '00';      // "floating" local time: right in any time zone
const icsFile = events => ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//ApexDigitalPros//SureDose//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', ...events.flat(), 'END:VCALENDAR'].map(icsFold).join('\r\n') + '\r\n';
const icsAlarm = (text, trigger) => ['BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEsc(text)}`, `TRIGGER:${trigger}`, 'END:VALARM'];
function apptEvent(a, p){
  const ev = ['BEGIN:VEVENT', `UID:suredose-appt-${a.id}@suredose.app`, `DTSTAMP:${icsUtc(now())}`];
  if (a.time) ev.push(`DTSTART:${icsLocal(a.date, a.time)}`, 'DURATION:PT1H');
  else ev.push(`DTSTART;VALUE=DATE:${a.date.replace(/-/g, '')}`, `DTEND;VALUE=DATE:${addDays(a.date, 1).replace(/-/g, '')}`);
  ev.push(`SUMMARY:${icsEsc(apptLabel(a) + (p.callName ? ` (${p.callName})` : ''))}`);
  const loc = [a.place, a.address].filter(Boolean).join(', ');
  if (loc) ev.push(`LOCATION:${icsEsc(loc)}`);
  const desc = [a.withWho && `With: ${a.withWho}`, a.phone && `Phone: ${a.phone}`, a.ride && `Ride: ${a.ride}`, a.bring && `Bring: ${a.bring}`, a.questions && `Questions to ask:\n${a.questions}`].filter(Boolean).join('\n');
  if (desc) ev.push(`DESCRIPTION:${icsEsc(desc)}`);
  return [...ev, ...icsAlarm(`${apptLabel(a)} tomorrow`, '-P1D'), ...icsAlarm(`${apptLabel(a)} soon`, '-PT2H'), 'END:VEVENT'];
}
function downloadApptIcs(id){
  const p = P(), a = p.appts.find(x => x.id === id);
  if (!a) return;
  download(`appointment-${slug(apptLabel(a))}-${a.date}.ics`, icsFile([apptEvent(a, p)]), 'text/calendar');
  toast('Calendar file saved. Open it to add the appointment to the calendar.', {ms: 7000});
}
function reminderGroups(p){                            // one group per clock time
  const map = new Map(), ds = toMin(ST().dayStartsAt);
  p.meds.filter(m => m.active && m.schedule.kind !== 'asNeeded').forEach(m => m.schedule.times.forEach(t => {
    const at = t.at || routineAt(t.slot), g = map.get(at) || {at, slot: t.slot, items: []};
    g.items.push({m, amount: t.amount ?? m.amount});
    map.set(at, g);
  }));
  return [...map.values()].sort((a, b) => ((toMin(a.at) - ds + 1440) % 1440) - ((toMin(b.at) - ds + 1440) % 1440));
}
function reminderRule(g){
  const sc = g.items.map(x => x.m.schedule);
  if (sc.every(s => s.kind === 'days')) return 'RRULE:FREQ=WEEKLY;BYDAY=' + [...new Set(sc.flatMap(s => s.days))].sort().map(d => ['SU', 'MO', 'TU', 'WE', 'TH', 'FR', 'SA'][d]).join(',');
  if (sc.length === 1 && sc[0].kind === 'everyN') return `RRULE:FREQ=DAILY;INTERVAL=${sc[0].everyN}`;
  return 'RRULE:FREQ=DAILY';
}
const remindersSig = p => JSON.stringify(reminderGroups(p).map(g => [g.at, reminderRule(g), g.items.map(x => x.m.id + ':' + x.amount).sort()]));
function reminderEvents(p){
  const today = careDay(now());
  return reminderGroups(p).map(g => {
    let first = today;
    for (let n = 0; n < 62; n++){ const d = addDays(today, n); if (g.items.some(x => medOnDay(x.m, d))){ first = d; break; } }
    const lines = g.items.map(x => `${medLabel(x.m)}: ${howText(x.m, x.amount)}`
      + (x.m.schedule.kind === 'days' && x.m.schedule.days.length < 7 ? ` (${joinList(x.m.schedule.days.map(d => DOW_LONG[d] + 's'))} only)` : x.m.schedule.kind === 'everyN' ? ` (every ${x.m.schedule.everyN} days)` : ''));
    const names = g.items.map(x => x.m.name), shown = names.length > 3 ? names.slice(0, 2).concat(`${names.length - 2} more`) : names;
    const title = `${p.callName ? p.callName + ': ' : ''}${joinList(shown)}`;
    return ['BEGIN:VEVENT', `UID:suredose-${p.id}-${g.at.replace(':', '')}@suredose.app`, `DTSTAMP:${icsUtc(now())}`, `DTSTART:${icsLocal(ymd(occTs(first, g.at)), g.at)}`, 'DURATION:PT15M', reminderRule(g),
      `SUMMARY:${icsEsc(title)}`, `DESCRIPTION:${icsEsc(lines.join('\n') + '\n\nOpen SureDose and tap I took it.')}`, ...icsAlarm(title, 'PT0M'), 'END:VEVENT'];
  });
}
function downloadReminderIcs(){
  const p = P(), events = reminderEvents(p);
  if (!events.length){ toast('There are no scheduled medicines to remind about yet.'); return; }
  download(`suredose-reminders-${slug(p.callName)}.ics`, icsFile(events), 'text/calendar');
  if (!sample){ store.ui.icsSig = remindersSig(p); store.ui.icsAt = isoLocal(now()); saveNow(); }
  toast('Reminder file saved. Open it to add the reminders to the calendar.', {ms: 7000});
  if (ui.route === 'settings') rerenderKeepFocus();
}

function onSettingChange(t){

const dueNow = () => { const p = P(), t = now(); return p ? todayModel(p, t).items.filter(i => !i.entry && ((i.status === 'due' && t >= i.ts) || i.status === 'notmarked')) : []; };
const sampleReminded = {day: '', keys: []};
function checkReminders(silent){
  const p = P();
  if (!p || noSave) return;
  const t = now(), day = careDay(t), r = sample ? sampleReminded : store.ui.reminded;
  if (r.day !== day){ r.day = day; r.keys = []; }
  const due = todayModel(p, t).items.filter(i => !i.entry && i.status === 'due' && t >= i.ts);
  const fresh = SLOTS.filter(s => due.some(i => i.slot === s.id) && !r.keys.includes(s.id));
  if (!fresh.length) return;
  fresh.forEach(s => r.keys.push(s.id));
  if (!sample) scheduleSave();
  if (silent) return;                                       // on opening the page: it's already showing what's due
  const s = fresh[fresh.length - 1], list = due.filter(i => i.slot === s.id);
  const title = `${p.callName ? p.callName + ': ' : ''}${p.callName ? s.name.toLowerCase() : s.name} medicines are due`;
  if (ST().reminders.inApp) dueChime();

function dueChime(){
  try {
    audioCtx ||= new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const t0 = audioCtx.currentTime;
    [523, 659, 784].forEach((f, k) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = t0 + k * .22;
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.2, t + .03); g.gain.exponentialRampToValueAtTime(.0001, t + .6);
      o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t + .65);
    });
  } catch (e) { /* no audio here */ }
}
async function showNotice(title, body, tag){

  } catch (e) { /* fall back to a page notification */ }
  try {
    const n = new Notification(title, {body, tag, requireInteraction: true});
    n.onclick = () => { window.focus(); go('today'); n.close(); };
    return true;
  } catch (e) { return false; }
}

// The same file runs in two places. Opened from disk it never touches the network. Served as index.html from a web
// address (the hosted phone copy), it also offers "Add to the home screen" and registers sw.js so it opens offline.
const HOSTED = /^https?:$/.test(location.protocol) && /(\/|\/index\.html)$/.test(location.pathname);
const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
let installPrompt = null;
function setupHosted(){
  if (!HOSTED) return;
  const add = (tag, attrs) => { const el = document.createElement(tag); Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v)); document.head.appendChild(el); };
  add('link', {rel: 'manifest', href: 'manifest.webmanifest'});
  add('link', {rel: 'apple-touch-icon', href: 'apple-touch-icon.png'});
  add('meta', {name: 'apple-mobile-web-app-capable', content: 'yes'});
  add('meta', {name: 'mobile-web-app-capable', content: 'yes'});
  add('meta', {name: 'apple-mobile-web-app-title', content: 'SureDose'});
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { /* no offline copy; the page still works */ });
  navigator.storage?.persist?.().catch(() => {});
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; if (['settings', 'setup'].includes(ui.route)) rerenderKeepFocus(); });
  window.addEventListener('appinstalled', () => { installPrompt = null; toast('SureDose is on the home screen.'); if (ui.route === 'settings') rerenderKeepFocus(); });
}

  store.settings = defaultSettings();                       // known routine: 8 AM / 1 PM / 6 PM / 9 PM, new day at 3 AM
  try {
    const mk = o => normalizeMed({createdAt: '2026-01-01T09:00:00', ...o});
    const T = (id, slot, at = '') => ({id, slot, at});
    const tp = normalizePerson({meds: [
      mk({id: 'a', name: 'Daily', schedule: {kind: 'daily', times: [T('t1', 'morning'), T('t2', 'night', '00:30')]}}),
      mk({id: 'b', name: 'Sundays', schedule: {kind: 'days', days: [0], times: [T('t1', 'morning')]}}),
      mk({id: 'c', name: 'Every3', schedule: {kind: 'everyN', everyN: 3, start: '2026-03-01', times: [T('t1', 'evening')]}}),
      mk({id: 'd', name: 'Prn', schedule: {kind: 'asNeeded'}, prn: {maxPerDay: 2, minHours: 4}}),
      mk({id: 'e', name: 'New', createdAt: '2026-03-02T10:00:00', schedule: {kind: 'daily', times: [T('t1', 'morning')]}}),
      mk({id: 'f', name: 'Stopped', active: false, stoppedOn: '2026-03-02', schedule: {kind: 'daily', times: [T('t1', 'morning')]}}),
      mk({id: 'g', name: 'Moved', schedule: {kind: 'daily', times: [T('t9', 'evening')]}, pastSchedules: [{until: '2026-03-01', schedule: {kind: 'daily', times: [T('t8', 'morning')]}}]})
    ]});
    const ids = day => dosesForDay(tp, day).map(o => o.med.id + ':' + o.slot);
    const sun = ids('2026-03-01'), mon = ids('2026-03-02');      // 2026-03-01 is a Sunday
    ok('Daily medicine shows twice on a two-dose day', mon.filter(x => x.startsWith('a:')).length === 2, mon.join(' '));
    ok('Sundays-only medicine: on Sunday, not on Monday', sun.includes('b:morning') && !mon.some(x => x.startsWith('b:')));
    ok('Every 3 days: day 0 and day 3, not day 1', sun.includes('c:evening') && !mon.includes('c:evening') && ids('2026-03-04').includes('c:evening'));
    ok('Every 3 days: nothing before the first day', !ids('2026-02-28').includes('c:evening'));

    ok('3:30 AM starts the new day', careDay(new Date(2026, 2, 3, 3, 30).getTime()) === '2026-03-03');
    const at = (h, m) => new Date(2026, 2, 2, h, m).getTime();

    const wk = mk({schedule: {kind: 'days', days: [0], times: [T('x', 'morning')]}, stock: {track: true, onHand: 4, lowDays: 7}});
    ok('4 tablets of a weekly medicine last 28 days', Math.round(daysLeft(wk)) === 28 && !refillState(wk));

    ok('Calendar text escapes commas, semicolons and line breaks', icsEsc('a,b;c\nd\\e') === 'a\\,b\\;c\\nd\\\\e');
    ok('Long calendar lines fold under 75 characters', icsFold('X'.repeat(200)).split('\r\n').every(l => l.length <= 75));
    const ev = apptEvent(normalizeAppt({id: 'z', title: 'Checkup', date: '2026-03-05', time: '10:30'}), tp).join('\n');
    ok('An appointment becomes a calendar event at its local time', ev.includes('DTSTART:20260305T103000') && ev.includes('TRIGGER:-P1D'));
    ok('A Sundays-only reminder repeats weekly on Sunday', reminderRule({items: [{m: tp.meds.find(m => m.id === 'b')}]}) === 'RRULE:FREQ=WEEKLY;BYDAY=SU');
    ok('An every-3-days reminder repeats every 3 days', reminderRule({items: [{m: tp.meds.find(m => m.id === 'c')}]}) === 'RRULE:FREQ=DAILY;INTERVAL=3');
    ok('Spreadsheet cells can’t start a formula', csvCell('=SUM(A1)') === '"\'=SUM(A1)"');
  } catch (err) { ok('The engine ran without errors', false, String(err)); }
  finally { store.settings = savedSettings; }
  // Contrast: every key text pair in all four color sets.
  const r = document.documentElement, keep = {theme: r.dataset.theme, contrast: r.dataset.contrast};
  const lum = hex => { const c = [0, 2, 4].map(i => parseInt(hex.replace('#', '').slice(i, i + 2), 16) / 255).map(x => x <= .03928 ? x / 12.92 : ((x + .055) / 1.055) ** 2.4); return .2126 * c[0] + .7152 * c[1] + .0722 * c[2]; };
  const ratio = (a, b) => { const [x, y] = [lum(a), lum(b)].sort((p, q) => q - p); return (x + .05) / (y + .05); };
  const pairs = [['text', 'bg', 7], ['text', 'surface', 7], ['text-2', 'surface', 4.5], ['text-2', 'bg', 4.5], ['text-2', 'surface-2', 4.5], ['text-3', 'surface', 4.5],
    ['on-accent', 'accent', 4.5], ['accent-text', 'surface', 4.5], ['good-text', 'good-soft', 4.5], ['good-text', 'surface', 4.5], ['warn-text', 'warn-soft', 4.5], ['warn-text', 'surface', 4.5],
    ['crit-text', 'crit-soft', 4.5], ['lav', 'lav-bg', 4.5], ['lav', 'surface', 4.5], ['link', 'surface', 4.5], ['link', 'surface-2', 4.5], ['cyan', 'bg', 4.5], ['placeholder', 'input-bg', 4.5]];
  for (const [theme, contrast, name] of [['light', 'normal', 'Light'], ['dark', 'normal', 'Dark'], ['light', 'high', 'High contrast, light'], ['dark', 'high', 'High contrast, dark']]){
    r.dataset.theme = theme; r.dataset.contrast = contrast;
    const cs = getComputedStyle(r), v = k => cs.getPropertyValue('--' + k).trim();
    const fails = pairs.filter(([a, b, min]) => ratio(v(a), v(b)) < min).map(([a, b, min]) => `${a} on ${b} ${ratio(v(a), v(b)).toFixed(2)} (needs ${min})`);
    ok(`${name} colors meet the contrast targets`, !fails.length, fails.join('; '));
  }

  const failed = results.filter(x => !x.pass);

}

/* ================= accessibility scan (console: SureDose.debug.a11yScan()) ================= */
// Checks what a screen reader and a shaky finger rely on: names, labels, unique ids, target size, heading order.
function a11yScan(){
  const issues = [], seen = new Map(), visible = el => { const r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0 && getComputedStyle(el).visibility !== 'hidden'; };
  const root = $('dialog[open]') || document.body;
  const nameOf = el => (el.getAttribute('aria-label') || (el.getAttribute('aria-labelledby') || '').split(' ').filter(Boolean).map(id => $('#' + CSS.escape(id))?.textContent || '').join(' ') || el.textContent || el.title || '').trim();
  $$('button, a[href], [role="button"]', root).filter(visible).forEach(el => {
    if (!nameOf(el)) issues.push(['No name', el.outerHTML.slice(0, 80)]);
    const r = el.getBoundingClientRect();
    if (!el.closest('p, li > span') && (r.height < 44 || r.width < 44) && !el.classList.contains('skip')) issues.push(['Small target', `${Math.round(r.width)}×${Math.round(r.height)} ${nameOf(el).slice(0, 40)}`]);
  });
  $$('input:not([type=hidden]), select, textarea', root).filter(el => visible(el) || el.closest('.chip, .switch-row')).forEach(el => {
    const labelled = el.labels?.length || el.getAttribute('aria-label') || el.getAttribute('aria-labelledby') || el.closest('label');
    if (!labelled) issues.push(['No label', el.outerHTML.slice(0, 80)]);
  });
  $$('[id]').forEach(el => { if (seen.has(el.id)) issues.push(['Duplicate id', el.id]); seen.set(el.id, true); });
  let last = 0;
  $$('h1, h2, h3, h4', $('#main')).filter(visible).forEach(h => { const n = +h.tagName[1]; if (last && n > last + 1) issues.push(['Heading skips a level', `${h.tagName}: ${h.textContent.trim().slice(0, 40)}`]); last = n; });
  if ($$('h1', $('#main')).length !== 1) issues.push(['Expected one h1', String($$('h1', $('#main')).length)]);
  return issues.length ? issues : 'No problems found.';
}

  if (!Number.isNaN(t)) debugNow = t;
  store.settings = normalizeSettings({...store.settings, ...['text', 'theme', 'contrast'].reduce((o, k) => shot.get(k) ? {...o, [k]: shot.get(k)} : o, {})});
  if (shot.has('example')) sample = {people: [samplePerson()], activePersonId: 'p_example'};
  if (shot.has('simple')) shotSimple = true;
} else shot.forEach((_, k) => shot.delete(k));
setupHosted();
applyDisplay();
showSaved(storageOk);
if (!location.hash && store.people.length){ try { history.replaceState(null, '', '#/today'); } catch (e) { /* sandboxed page */ } }
render(false);
checkReminders(true);                       // what's already due when SureDose opens is on screen; remind only for what comes due later
if (shot.get('view') === 'week') ui.hist.mode = 'week';
if (isYmd(shot.get('day'))) ui.hist.day = shot.get('day');
if (shot.get('med')) ui.hist.med = shot.get('med');
if (shot.has('view') || shot.has('day') || shot.has('med')) renderMain();
if (shot.get('edit')) openMedEditor(shot.get('edit') === 'new' ? null : shot.get('edit'));
if (shot.get('dose') && P()){ const o = dosesForDay(P(), careDay(now())).find(x => x.med.id === shot.get('dose')); if (o) openDoseSheet(o.key); }
if (shot.get('print') && P()) preparePrint(shot.get('print'), {days: +shot.get('days') || 7, appt: P().appts.find(a => a.id === shot.get('appt'))});
if (shot.has('help')) openHelp();
})();
</script>
</body>
</html>
